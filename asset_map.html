    <style>
        /* Brute force grayscale style .leaflet-tile-container { filter: grayscale(100%); -webkit-filter: grayscale(100%); } */
        /* 1. DEFINE LIGHT MODE VARIABLES (WHEN CHECKED) */
        /* :root {  */
        .toggle-checkbox:checked~.content {
            --bg-primary: #ffffff;
            --text-primary: #1a1a1a;
            --accent-color: #3b82f6;
            --card-bg: #f3f4f6;
        }

        /* 2. DEFINE DARK MODE VARIABLES (DEFAULT) */
        /* The '~' combinator tells CSS: "find the .content container that comes after the checked box" */
        /* .toggle-checkbox:checked~.content { */
        :root {
            /* --bg-primary: #121212;
            --text-primary: #f9fafb;
            --accent-color: #60a5fa;
            --card-bg: #1e1e1e; */

            .leaflet-tile-container {
                filter: grayscale(25%) contrast(100%) brightness(90%);
                -webkit-filter: grayscale(25%) contrast(100%) brightness(90%);
            }
        }

        /* 3. APPLY VARIABLES TO GLOBAL ELEMENTS */
        .content {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            /* min-height: 100vh; */
            /* padding: 2rem; */
            padding: 1rem;
            transition: background-color 0.3s ease, color 0.3s ease;
            /* Smooth fade effect */
        }

        .cta-btn {
            background-color: var(--accent-color);
            color: var(--bg-primary);
            border: none;
            /* padding: 10px 20px; */
            /* border-radius: 6px; */
            cursor: pointer;
        }

        /* 4. THE TOGGLE SWITCH STYLING */
        .theme-wrapper {
            position: relative;
        }

        /* Hide the actual ugly checkbox */
        .toggle-checkbox {
            opacity: 0;
            position: absolute;
        }

        /* Toggle track */
        .toggle-label {
            background-color: #111827;
            /* Dark track by default */
            /* width: 60px; height: 30px; border-radius: 50px; */
            width: 40px;
            height: 20px;
            border-radius: 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* padding: 5px; */
            cursor: pointer;
        }

        /* Moving inner ball */
        .toggle-ball {
            background-color: #fff;
            /* width: 22px; height: 22px; */
            width: 10px;
            height: 10px;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            left: 5px;
            transition: transform 0.2s linear;
        }

        /* Move the ball to the right side when checked */
        .toggle-checkbox:checked+.toggle-label .toggle-ball {
            transform: translateX(20px);
        }

        /* Change toggle track color based on mode */
        .toggle-checkbox:checked+.toggle-label {
            background-color: #e5e7eb;
        }

        .toggle-checkbox:checked+.toggle-label .toggle-ball {
            background-color: #f59e0b;
            /* Makes the ball look yellow/sun-like in dark mode */
        }
    </style>

        // 1. Central Reset Function
        function uncheckAllOverlays() {
            isProgrammaticChange = true; // Block event tracking to prevent infinite loops

            // Loop through your main layer Map
            layerMap.forEach(function (layer) {
                // Explicitly remove the structural layers from the map.
                // Leaflet catches this call and automatically unchecks their checkboxes!
                if (map.hasLayer(layer)) {
                    map.removeLayer(layer);
                }
            });

            // Wipe the visual content container clean
            content.clearLayers();
            //zipsLG.clearLayers(); //TODO: Find a better way to do this
            shapesLG.clearLayers();

            // Collect all the checkbox label blocks inside the Leaflet Control menu
            const labels = document.querySelectorAll('.leaflet-control-layers-overlays label');
            labels.forEach(function (label) {
                const labelText = label.textContent.trim();
                const checkbox = label.querySelector('input[type="checkbox"]');
                // If the box is currently checked, programmatically click it!
                // This instantly updates the UI and naturally fires Leaflet's layer-remove logic.
                if (checkbox && checkbox.checked) {
                    checkbox.click();
                }
            });

            // Explicitly uncheck the "Clear" checkbox itself so it pops back to empty
            //if (map.hasLayer(clearSwitch)) {

            //}

        // 2. Master GET Routing Variable Function

            const curLayer = layerMap.get(overlayName);

        }

        // 3. Central Multi-Layer Intersection Compiler
        function rebuildMasterContent() {
            content.clearLayers(); // Wipe out old visual frames
            const uniqueMarkersToRender = new Set();
            const activeGroups = [];

            // Dynamically find which structural toggle layers Leaflet considers active
            layerMap.forEach(function (layer) {
                if (map.hasLayer(layer)) {
                    activeGroups.push(layer);
                }
            });

            // Safely extract markers into a unique Set to solve duplication overlapping
            activeGroups.forEach(function (subLayer) {
                subLayer.eachLayer(function (marker) {
                    uniqueMarkersToRender.add(marker);
                });
            });

            // Populate the master visible frame layer with the filtered markers
            uniqueMarkersToRender.forEach(function (marker) {
                marker.addTo(content);
            });
        }

        function onEachFeatureShapes(feature, layer) {

            layer.on({
                mouseover: highlightFeature,
                mouseout: resetHighlight
                //click: zoomToFeature
            });

            const propertyNames = Object.keys(feature.properties);
            const thirdKeyName = propertyNames[2];
            const fourthKeyName = propertyNames[3];

            let pointID = 0;
            let pointName = "NA";

            let oyTotal = 0;
            let oyRate = 0;
            let oyDensity = 0;

            var landAreaSM = feature.properties.ALAND20; // square meters
            var landArea = (landAreaSM / 2589988.1103).toFixed(2);

            if (thirdKeyName == 'GEOID20') { // reading zips.js
                pointID = feature.properties.GEOID20;
                pointName = feature.properties.ZCTA5CE20;
                feature.properties.pointName = pointName;

                var match = zipData.find(item => item.GEOID20 === pointID);

                oyRate = match ? match.oy_pct : 0;
                youthPop = match ? match.pop_16_24 : 0;
                oyTotal = (youthPop * oyRate).toFixed(0);
                oyDensity = (oyTotal / landArea).toFixed(1);
                oyRate = (oyRate * 100).toFixed(1);
                feature.properties.density = oyDensity;

            } else { //reading pumas.js
                pointID = feature.properties[fourthKeyName];
                //pointName = feature.properties.CLQW;
                //var match = pumaData.find(item => item.NAMELSAD20 === pointID);
                //var match = pumaShapes.find(item => item.NAMELSAD20 === pointID);
                //pointName = match ? match.NAMELSAD20 : "NA";
                pointName = feature.properties.NAMELSAD20;
                oyTotal = feature.properties._dy_total;
                oyRate = feature.properties._dy_rate;
                oyDensity = (oyTotal / landArea).toFixed(1);
                feature.properties.density = oyDensity;
                feature.properties.pointName = pointName;
            }

            //let popupContent = `<p>Geometry type: ${feature.geometry.type}!</p>`;
            let popupContent = '';
            if (pointName != "NA") {
                popupContent += `<strong> ${pointName} </strong>`;
            }
            popupContent += `<br> Opportunity Youth: ${oyTotal}`;
            popupContent += `<br> Disconnection Rate: ${oyRate} %`;
            popupContent += `<br> Land Area: ${landArea} mi²`;
            popupContent += `<br> Density: ${oyDensity} OY per mi²`;
            layer.bindPopup(popupContent);

            // Update style so color will reflect density we just calculated
            const updatedStyle = style(feature);
            layer.setStyle(updatedStyle);
        }

        function addToAbbreviationDatabase(data, nameColName, abvColName) {
            // Safety check: ensure data is a valid array
            if (!Array.isArray(data)) {
                console.error("Provided data is not a valid array.");
                return;
            }

            let itemsAdded = 0;

            data.forEach(row => {
                // Extract the raw values dynamically using the provided column name strings
                const rawAbv = row[abvColName];
                const rawName = row[nameColName];

                // Clean and normalize the abbreviation key (trimmed, uppercase for consistency)
                if (rawAbv && rawName) {
                    //const cleanAbv = rawAbv.toString().trim().toUpperCase();
                    const cleanAbv = rawAbv.toString().trim().toLowerCase();
                    const cleanName = rawName.toString().trim();

                    // Add or update the registry
                    abbreviationDB[cleanAbv] = cleanName;
                    itemsAdded++;
                }
            });

            console.log(`Database Updated: Registered ${itemsAdded} entries using columns [Abv: "${abvColName}", Name: "${nameColName}"].`);

            const match = Object.keys(abbreviationDB).find(key => {
                return abbreviationDB[key].toLowerCase().trim() === searchName;

        async function filterContentByMatch(urlParams) {

            const keysa = [...urlParams.keys()];
            const valsa = [...urlParams.values()];
            const ukeys = [...new Set(keysa)];

            if (keysa.length === 0) { return; }

            content.clearLayers();

            var zipCount = 0;
            var serviceCount = 0;

            //lets convert abbreviated services to full services
            if (keysa.includes('service')) {
                // get the indices that match "service"
                let temp = 0
                var ServicesStr = ""
                const svcIdx = keysa
                    .map((key, index) => key === 'service' ? index : -1)
                    .filter(index => index !== -1);
                //console.log(svcIdx);
                //const allServices = urlParams.getAll('service');
                svcIdx.forEach(idx => {
                    serviceCount++;
                    var val = valsa[idx];
                    ServicesStr += val + ";";

                    // var match_row = serviceDataJSN.find(item => item.Abbreviation === val);
                    // if (match_row != undefined) {
                    //     var match = match_row.Service;
                    //     val = match ? match : val;
                    // }
                    // valsa[idx] = val;
                });
                document.getElementById('ServicesStr').value = ServicesStr;
            }
            //Add adjacent zip codes
            if (keysa.includes('zip')) {
                // get the indices that match "zip"
                //let temp = 0
                const zipIdx = keysa
                    .map((key, index) => key === 'zip' ? index : -1)
                    .filter(index => index !== -1);
                zipIdx.forEach(idx => {
                    zipCount++;
                    var val = valsa[idx];
                    document.getElementById('ZipCode').value = val;
                    var match_row = zipData.find(item => item.ZCTA === val);
                    if (match_row != undefined) {
                        var zipString = match_row.adjacent;
                        zipString.split(',').forEach(zip => {
                            keysa.push('zip');
                            valsa.push(zip.trim());
                        });
                    }
                });
            }
            if (keysa.includes('population')) {
                const popIdx = keysa
                    .map((key, index) => key === 'population' ? index : -1)
                    .filter(index => index !== -1);
                popIdx.forEach(idx => {
                    //popCount++;
                    var val = valsa[idx];
                    document.getElementById('Population').value = val;
                });
            }

            // multiple zips will always be or
            // multiple services can be and or or
            /// most of the time, multiple services will be or
            // there should not be multiple providers
            // if provider is specified, then it should override other filters
            // service + zip should always be and

            console.log("Processing map filters...");

            partnerDataLayer.eachLayer(function (layer) {
                const properties = layer.feature.properties;
                let targetKey;
                let targetValue;
                let matches = 0;
                for (let i = 0; i <= keysa.length; i++) {
                    targetKey = keysa[i];
                    if (targetKey == 'service') { targetKey = 'services'; }
                    const hasKey = Object.keys(properties).includes(targetKey);
                    if (hasKey) {
                        targetValue = valsa[i];
                        if (targetValue.toLowerCase() == "unknown") { continue; }
                        targetValue = decodeURIComponent(targetValue.replace(/\+/g, ' '));
                        targetValue = cleanString(targetValue);
                        var vals = properties[targetKey]; //vals from layer, can be array if services
                        var safeVals = Array.isArray(vals) ? vals : [vals];
                        safeVals.forEach(element => {
                            var cval = element;
                            val = cleanString(cval);
                            if (val == targetValue) {
                                matches++;
                            }
                        });
                    }
                }
                if (matches >= ukeys.length) {
                    layer.addTo(content);
                    layer._icon.classList.add('pulsating-icon');
                }
            });

            if (content.getLayers().length == 1) { // should only have 1 active marker
                content.getLayers().forEach(function (layer, index) {
                    // Check if it's a marker (icon) vs a shape (polygon/polyline)
                    if (layer instanceof L.Marker) {
                        layer.openPopup();
                    } else { }
                });
            }

            // Zoom to icon(s)
            // Create an empty bounds container
            const bounds = L.latLngBounds();
            // Loop through the markers in content and extend the bounds
            content.eachLayer(function (layer) {
                if (typeof layer.getLatLng === 'function') {
                    bounds.extend(layer.getLatLng());
                } else if (typeof layer.getBounds === 'function') {
                    bounds.extend(layer.getBounds());
                }
            });
            console.log("Done processing map filters. Setting bounds...");
            // Zoom the map to the manually calculated bounds
            //map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
            try {
                // Attempt to fit the map to the bounds
                map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
                //return true;
            } catch (error) {
                // Check if it's the specific error you're looking for
                if (error.message && error.message.includes("Bounds are not valid")) {
                    //displayNoMatchesMessage();
                    showTimedNotice('No Matches Found!', 'Please try your search again...');
                    return false;
                } else {
                    // Log any other unexpected errors to the console
                    console.error("An unexpected map error occurred:", error);
                    //return false;
                }
            }
        }

        function loadGJSNScript(scriptName) { //TODO: only load once
            return new Promise((resolve, reject) => {
                // 1. If it's already loaded, don't load it again
                //if (document.querySelector('script[src="zipShapes.js"]')) {
                if (document.querySelector(`script[src="${scriptName}"]`)) {
                    resolve();
                    return;
                }

                // 2. Create the script element dynamically
                const script = document.createElement('script');
                //script.src = 'zipShapes.js';
                script.src = scriptName;
                script.type = 'text/javascript';

                // 3. Setup resolve on success, reject on error
                script.onload = () => resolve();
                script.onerror = () => reject(new Error('Failed to load ->', scriptName));

                // 4. Inject it into the page
                document.head.appendChild(script);
                console.log("GJSN Data should be available...")
            });
        }
