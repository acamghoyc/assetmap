<!DOCTYPE html>
<html>

<head>
    <title>Shortbread Map in Leaflet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Leaflet VectorGrid Plugin -->
    <script src="https://unpkg.com/leaflet.vectorgrid@latest/dist/Leaflet.VectorGrid.bundled.js"></script>

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script>
        // 1. Initialize Map
        var map = L.map('map').setView([29.7499, -95.3584], 9); // Centered on Houston, TX

        // 2. Define Vector Tile URL (Example using VersaTiles / OSM)
        //var tileUrl = 'https://versatiles.org{z}/{x}/{y}.pbf';
        var tileUrl = 'https://tiles.versatiles.org/tiles/osm/{z}/{x}/{y}';

        // 3. Define styling rules for Shortbread layers
        // This just results in thick blue lines
        // var vectorTileOptions = {
        //     rendererFactory: L.canvas.tile,
        //     vectorTileLayerStyles: {
        //         water: { fillStyle: '#a5c9eb' },
        //         landuse: { fillStyle: '#e9e5dc' },
        //         buildings: { fillStyle: '#d1cdc7', stroke: true, color: '#b3aea6', weight: 0.5 },
        //         roads: function (properties) {
        //             var color = properties.class === 'primary' ? '#f5b041' : '#ffffff';
        //             var weight = properties.class === 'primary' ? 4 : 2;
        //             return { stroke: true, color: color, weight: weight };
        //         }
        //     }
        // };
        var vectorTileOptions = {
            rendererFactory: L.canvas.tile,
            // VectorGrid matches styling to layer names. Unmatched layers turn blue.
            vectorTileLayerStyles: {
                // Catch-all: Hide everything that isn't explicitly styled below
                _default: { fill: false, stroke: false, radius: 0, opacity: 0, fillOpacity: 0 },

                //1. Water Layers
                ocean: { fill: false, fillStyle: '#a5c9eb', fillColor: '#a5c9eb', fillOpacity: 0.1, stroke: false },
                water_polygons: { fill: false, fillStyle: '#a5c9eb', fillColor: '#a5c9eb', fillOpacity: 0.1, stroke: false },
                water_lines: { stroke: false, color: '#a5c9eb', weight: 0.1 },

                //2. Land & Structural Base
                landuse: { fill: false, fillStyle: '#e9e5dc', fillColor: '#e9e5dc', fillOpacity: 0.1, stroke: false },
                buildings: { fill: true, fillColor: '#d1cdc7', fillOpacity: 0.1, stroke: true, color: '#b3aea6', weight: 0.5 },

                //3. FIXED: Shortbread uses "streets" for transport networks
                streets: function (properties) {
                    var isMajor = (properties.kind === 'primary' || properties.kind === 'motorway' || properties.kind === 'secondary');
                    return {
                        stroke: true,
                        color: isMajor ? '#f5b041' : '#ffffff',
                        weight: isMajor ? 0.1 : 1
                    };
                },

                //4. Handle boundary outlines gracefully(or hide them by returning stroke: false)
                boundaries: { stroke: false, color: '#ccc', weight: 1, dashArray: '4,4' }
            }
        };


        // 4. Add to map
        var vectorLayer = L.vectorGrid.protobuf(tileUrl, vectorTileOptions).addTo(map);
    </script>
</body>

</html>
