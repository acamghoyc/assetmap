        ]);

        // Helper function to extract all coordinate pairs as unique string keys ("lng,lat")
        function getCoordinateSet(geometry) {
            const coords = new Set();
            if (!geometry || !geometry.coordinates) return coords;

            // Flatten Polygons and MultiPolygons recursively
            function extract(arr) {
                if (typeof arr[0] === 'number' && typeof arr[1] === 'number') {
                    // Round to 4 decimal places to account for minor floating-point clipping variations (~11 meters precision)
                    coords.add(`${arr[0].toFixed(4)},${arr[1].toFixed(4)}`);
                    return;
                }
                for (let i = 0; i < arr.length; i++) {
                    extract(arr[i]);
                }
            }

            extract(geometry.coordinates);
            return coords;
        }

        function calculateAdjacencies() {
            if (!window.zipShapes || !window.zipShapes.features) {
                console.error("Could not find window.zipShapes data.");
                return;
            }

            const results = {};
            const features = window.zipShapes.features;

            // Filter and pre-map coordinate sets for efficiency
            const targetFeatures = features.map(f => {
                const props = f.properties;
                const zip = props.ZCTA5CE20 || props.ZCTA5CE10 || props.ZCTA5 || props.GEOID20 || props.GEOID10;
                return {
                    zip: zip,
                    coordSet: getCoordinateSet(f.geometry)
                };
            }).filter(f => myZipList.has(f.zip) && f.coordSet.size > 0);

            console.log(`Analyzing coordinate links for ${targetFeatures.length} matching shapes...`);

            // Initialize empty arrays for all found target ZIPs
            targetFeatures.forEach(f => results[f.zip] = []);

            // Compare vertex networks
            for (let i = 0; i < targetFeatures.length; i++) {
                const zipA = targetFeatures[i].zip;
                const setA = targetFeatures[i].coordSet;

                for (let j = i + 1; j < targetFeatures.length; j++) {
                    const zipB = targetFeatures[j].zip;
                    const setB = targetFeatures[j].coordSet;

                    // Find intersection count of shared coordinates
                    let sharedPoints = 0;
                    for (let coord of setA) {
                        if (setB.has(coord)) {
                            sharedPoints++;
                            // If they share 2 or more vertices, they share a border line segment
                            if (sharedPoints >= 2) {
                                results[zipA].push(zipB);
                                results[zipB].push(zipA);
                                break;
                            }
                        }
                    }
                }
            }

            // Output Results Table
            console.clear();
            const tableData = Object.entries(results).map(([zip, adjacent]) => ({
                "ZCTA": zip,
                "Adjacent ZIP Codes": adjacent.sort().join(', ') || 'None found'
            })).sort((a, b) => a.ZCTA.localeCompare(b.ZCTA));

            console.table(tableData);
        }

        window.addEventListener('DOMContentLoaded', calculateAdjacencies);
    </script>
